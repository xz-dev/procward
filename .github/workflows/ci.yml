# SPDX-License-Identifier: BSD-3-Clause
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Source, executor and toolchain
        shell: bash
        run: |
          git rev-parse HEAD
          rustup update stable --no-self-update
          rustc -vV
          test "$(rustc -vV | sed -n 's/host: //p')" = '${{ matrix.target }}'
      - name: Release safety regression tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 .github/scripts/test-release.py
      - name: Full standalone fixture suite
        run: |
          cargo build --locked --bins --examples
          cargo test --locked --all-targets --no-fail-fast -- --nocapture
      - name: Distribution size and startup (informational)
        shell: bash
        run: python3 .github/scripts/build-dist.py '${{ matrix.target }}'
      - name: MSRV
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          rustup toolchain install 1.87.0 --profile minimal --no-self-update
          cargo +1.87.0 check --locked --all-targets
  musl:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read native musl image pin
        id: images
        run: echo "runtime=$(sed -n 's/^FROM //p' ci/images/alpine-native/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Native musl build and full fixture execution
        run: |
          docker run --rm -v "$PWD:/src" -w /src '${{ steps.images.outputs.runtime }}' sh -ec '
            apk add --no-cache cargo rust musl-dev gcc git python3
            git -c safe.directory=/src rev-parse HEAD
            rustc -vV
            test "$(rustc -vV | sed -n "s/host: //p" | sed "s/-alpine-/-unknown-/")" = "${{ matrix.target }}"
            cargo build --locked --bins --examples
            cargo test --locked --all-targets --no-fail-fast -- --nocapture
          '
      - name: Static distribution size and startup (informational)
        run: |
          sudo chown -R "$(id -u):$(id -g)" target
          rustup update stable --no-self-update
          rustup target add '${{ matrix.target }}'
          key=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          export "CARGO_TARGET_${key}_RUSTFLAGS=-C target-feature=+crt-static -C link-self-contained=yes"
          export "CARGO_TARGET_${key}_LINKER=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/rust-lld"
          python3 .github/scripts/build-dist.py '${{ matrix.target }}'
  freebsd:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, target: x86_64-unknown-freebsd }
          - { runner: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-freebsd }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.3'
          arch: ${{ matrix.arch }}
          copyback: true
          prepare: pkg install -y rust git python311 binutils
          run: |
            set -eu
            git -c safe.directory="$PWD" rev-parse HEAD
            uname -a
            rustc -vV
            test "$(rustc -vV | sed -n 's/host: //p')" = '${{ matrix.target }}'
            cargo build --locked --bins --examples
            cargo test --locked --all-targets --no-fail-fast -- --nocapture
            unset GITHUB_STEP_SUMMARY GITHUB_ENV
            python3.11 .github/scripts/build-dist.py '${{ matrix.target }}'
            rm -rf target
      - name: Guest distribution size and startup summary
        run: cat 'artifacts/${{ matrix.target }}/summary.md' >> "$GITHUB_STEP_SUMMARY"
  riscv64:
    name: ${{ matrix.target }} (qemu-user)
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: riscv64gc-unknown-linux-gnu
            libc: gnu
            image: debian-riscv64
          - target: riscv64gc-unknown-linux-musl
            libc: musl
            image: alpine-riscv64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROCWARD_CI_TARGET: ${{ matrix.target }}
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: bash .github/scripts/run-riscv64.sh
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUNNER: bash .github/scripts/run-riscv64.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read target runtime and binfmt image pins
        id: images
        run: |
          runtime=$(sed -n 's/^FROM //p' 'ci/images/${{ matrix.image }}/Dockerfile')
          {
            echo "runtime=$runtime"
            echo "binfmt=$(sed -n 's/^FROM //p' ci/images/binfmt/Dockerfile)"
          } >> "$GITHUB_OUTPUT"
          echo "PROCWARD_CI_IMAGE=$runtime" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: riscv64
          image: ${{ steps.images.outputs.binfmt }}
      - name: Official cross toolchain and target runtime
        run: |
          git rev-parse HEAD
          rustup update stable --no-self-update
          rustup target add '${{ matrix.target }}'
          rustc -vV
          rustup target list --installed | grep -Fx '${{ matrix.target }}'
          echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/rust-lld" >> "$GITHUB_ENV"
          if [ '${{ matrix.libc }}' = gnu ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
          fi
          echo 'emulated (qemu-user) — semantics of prctl/pidfd/process groups are passed through to the host kernel; timings are not representative'
          cat /proc/sys/fs/binfmt_misc/qemu-riscv64
          docker run --rm --platform linux/riscv64 '${{ steps.images.outputs.runtime }}' uname -m
      - name: Prepare pinned fixture runtime with Python
        run: |
          docker build --platform linux/riscv64 -t procward-fixture-runtime 'ci/images/${{ matrix.image }}'
          echo 'PROCWARD_CI_IMAGE=procward-fixture-runtime' >> "$GITHUB_ENV"
      - name: Cross-build exact release target and fixtures
        run: |
          cargo build --locked --release --target '${{ matrix.target }}' --bins --examples
          file 'target/${{ matrix.target }}/release/procward' 'target/${{ matrix.target }}/release/examples/fixture'
          readelf -h 'target/${{ matrix.target }}/release/procward' | grep 'Machine:.*RISC-V'
      - name: Full suite against emulated release binaries
        id: fixtures
        run: |
          set -o pipefail
          cargo test --locked --release --target '${{ matrix.target }}' --all-targets --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/riscv-fixtures.log"
      - name: Distribution size and startup (emulated, informational)
        run: python3 .github/scripts/build-dist.py '${{ matrix.target }}' --runner 'bash .github/scripts/run-riscv64.sh'
      - name: Count and list emulator-unsupported cases
        if: always()
        run: python3 .github/scripts/emulation-summary.py '${{ matrix.target }}' '${{ steps.fixtures.outcome }}' "$RUNNER_TEMP/riscv-fixtures.log"
