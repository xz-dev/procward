# SPDX-License-Identifier: BSD-3-Clause
[package]
name = "procward"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "BSD-3-Clause"
autotests = false
description = "Process-tree ownership and job control for CLI programs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "platform"
path = "tests/platform.rs"

[[test]]
name = "freebsd"
path = "tests/freebsd.rs"

[[test]]
name = "windows"
path = "tests/windows.rs"

[[test]]
name = "darwin"
path = "tests/darwin.rs"

[[example]]
name = "fixture"
path = "tests/fixtures/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = { version = "=0.14.11" }
errno = "=0.3.14"
rustix = { version = "=1.1.6", default-features = false, features = ["std", "fs", "process", "pipe"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "process", "time"] }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "process-group"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "pipe"] }
signal-hook = { version = "=0.4.5", default-features = false, features = ["iterator"] }
